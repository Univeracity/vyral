version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk-net:
        patterns:
          - AWSSDK.*
      mcp-sdk:
        patterns:
          - ModelContextProtocol.*
      sqlitepclraw:
        patterns:
          - SQLitePCLRaw.*
      xunit-runner:
        patterns:
          - xunit.runner.visualstudio
    ignore:
      # System.CommandLine 2.x requires an intentional CLI API migration.
      - dependency-name: System.CommandLine
        versions:
          - ">= 2.0.0"

  - package-ecosystem: npm
    directory: /clients/javascript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /clients/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /runtimes/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /clients/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /workers/execution-smoke-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /workers/execution-smoke-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
      docker-publish-actions:
        patterns:
          - docker/login-action
          - docker/build-push-action
