name: Publish package release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed annotated tag for the authorized package release
        required: true
        type: choice
        options:
          - v0.3.3
      npm_direct_token_published:
        description: The exact authorized npm archive has been published with an operator-controlled token
        required: true
        type: boolean
      confirm:
        description: I have reviewed the release evidence, package scope, and release notes
        required: true
        type: boolean

permissions: {}

concurrency:
  group: publish-package-release-v0.3.3
  cancel-in-progress: false

jobs:
  validate:
    name: Validate package release authority
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the signed current release tag and canonical evidence
        id: authority
        env:
          CONFIRM: ${{ inputs.confirm }}
          NPM_DIRECT_TOKEN_PUBLISHED: ${{ inputs.npm_direct_token_published }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "true"
          test "$NPM_DIRECT_TOKEN_PUBLISHED" = "true"
          test "$RELEASE_TAG" = "v0.3.3"
          git fetch --force --tags origin
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          source_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_sha" = "$(git rev-parse origin/main)"
          tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            | jq -e '.verification.verified == true' >/dev/null
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release-integrity.yml/runs?head_sha=$source_sha&event=push&status=success&per_page=20" \
            | jq -e '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length > 0' >/dev/null
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build authorized package artifacts
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - name: Check out the authorized release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Build and verify only the authorized distributions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.3.0
          python3 scripts/verify-publication-cohort.py
          scripts/verify-dotnet-lockfiles.sh
          mkdir -p artifacts/publish/nuget artifacts/publish/pypi artifacts/publish/npm
          for project in \
            src/Vyral.Abstractions/Vyral.Abstractions.csproj \
            src/Vyral.Local/Vyral.Local.csproj; do
            dotnet pack "$project" --configuration Release --no-restore \
              --output artifacts/publish/nuget
          done
          python -m build --outdir artifacts/publish/pypi runtimes/python
          for package in \
            Vyral.Abstractions.0.3.3 \
            Vyral.Local.0.3.3; do
            test -s "artifacts/publish/nuget/${package}.nupkg"
            test -s "artifacts/publish/nuget/${package}.snupkg"
          done
          test -s artifacts/publish/pypi/vyral-0.1.4-py3-none-any.whl
          test -s artifacts/publish/pypi/vyral-0.1.4.tar.gz
          npm ci --ignore-scripts --prefix clients/javascript
          (
            cd clients/javascript
            npm run check
            npm run typecheck
            npm test
            npm pack --json --pack-destination ../../artifacts/publish/npm
          )
          test -s artifacts/publish/npm/vyral-client-0.3.3.tgz

      - name: Retain immutable publication distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-release-v0.3.3
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: Publish authorized NuGet packages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: publish-nuget
      url: https://www.nuget.org/profiles/Univeracity
    permissions:
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download the authorized distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-release-v0.3.3
          path: dist

      - name: Exchange the GitHub OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish only the authorized NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in \
            Vyral.Abstractions.0.3.3 \
            Vyral.Local.0.3.3; do
            dotnet nuget push "dist/nuget/${package}.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate \
              --source https://api.nuget.org/v3/index.json
            dotnet nuget push "dist/nuget/${package}.snupkg" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate \
              --source https://api.nuget.org/v3/index.json
          done

  publish-pypi:
    name: Publish authorized Python runtime
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: publish-pypi
      url: https://pypi.org/p/vyral
    permissions:
      id-token: write
    steps:
      - name: Download the authorized distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-release-v0.3.3
          path: dist

      - name: Publish the Python runtime with its PyPI attestation
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi
          skip-existing: true

  publish-npm:
    name: Verify authorized direct-token JavaScript SDK
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: publish-npm
      url: https://www.npmjs.com/package/vyral-client
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Download the authorized distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-release-v0.3.3
          path: dist

      - name: Verify the exact authorized registry archive
        run: |
          set -euo pipefail
          expected_integrity="sha512-$(openssl dgst -sha512 -binary dist/npm/vyral-client-0.3.3.tgz | base64 -w 0)"
          test "$(npm view vyral-client@0.3.3 version)" = "0.3.3"
          test "$(npm view vyral-client@0.3.3 repository.url)" = "git+https://github.com/univeracity/vyral.git"
          test "$(npm view vyral-client@0.3.3 dist.integrity)" = "$expected_integrity"

  verify:
    name: Verify public package availability
    needs:
      - publish-nuget
      - publish-pypi
      - publish-npm
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Wait for exact registry versions
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            nuget_abstractions="$(curl --fail --silent --show-error https://api.nuget.org/v3-flatcontainer/vyral.abstractions/index.json | jq -r '.versions[-1]')" || true
            nuget_local="$(curl --fail --silent --show-error https://api.nuget.org/v3-flatcontainer/vyral.local/index.json | jq -r '.versions[-1]')" || true
            pypi="$(curl --fail --silent --show-error https://pypi.org/pypi/vyral/json | jq -r '.info.version')" || true
            npm_version="$(curl --fail --silent --show-error https://registry.npmjs.org/vyral-client/0.3.3 | jq -r '.version')" || true
            if [[ "$nuget_abstractions" == "0.3.3" && "$nuget_local" == "0.3.3" && "$pypi" == "0.1.4" && "$npm_version" == "0.3.3" ]]; then
              printf 'NuGet, PyPI and npm expose every authorized package version.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "The authorized package versions were not all visible before the verification deadline." >&2
          exit 1
