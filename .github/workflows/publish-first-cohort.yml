name: Publish package release

on:
  workflow_dispatch:
    inputs:
      npm_stage_only:
        description: Stage only vyral-client 0.3.4 for separate npm 2FA approval
        type: boolean
        default: false
      release_tag:
        description: Signed annotated tag for the authorized package release
        required: true
        type: choice
        options:
          - v0.3.4
      confirm:
        description: I have reviewed the release evidence, package scope, and release notes
        required: true
        type: boolean

permissions: {}

concurrency:
  group: publish-package-release-v0.3.4
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.npm_stage_only }}
    name: Validate package release authority
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the signed current release tag and canonical evidence
        id: authority
        env:
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "true"
          test "$RELEASE_TAG" = "v0.3.4"
          git fetch --force --tags origin
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          source_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_sha" = "$(git rev-parse origin/main)"
          tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            | jq -e '.verification.verified == true' >/dev/null
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release-integrity.yml/runs?head_sha=$source_sha&event=push&status=success&per_page=20" \
            | jq -e '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length > 0' >/dev/null
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  stage-npm:
    name: Stage JavaScript client for npm review
    if: ${{ inputs.npm_stage_only }}
    runs-on: ubuntu-22.04
    environment:
      name: publish-npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main, explicit confirmation and canonical release evidence
        env:
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-integrity.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length' \
            | grep -Eq '^[1-9][0-9]*$'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with staged publishing support
        run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Validate and pack the exact client
        working-directory: clients/javascript
        run: |
          set -euo pipefail
          node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(p.name !== "vyral-client" || p.version !== "0.3.4" || p.private) process.exit(1)'
          npm ci --ignore-scripts
          npm run check
          npm run typecheck
          npm test
          npm pack --ignore-scripts --json > pack.json
          jq -e -f ../../scripts/validate-npm-pack-layout.jq pack.json >/dev/null
          test -s vyral-client-0.3.4.tgz
          sha256sum vyral-client-0.3.4.tgz >> "$GITHUB_STEP_SUMMARY"
      - name: Stage tested bytes using npm OIDC
        working-directory: clients/javascript
        run: npm stage publish ./vyral-client-0.3.4.tgz --access public --tag latest
      - name: Explain the remaining approval
        run: |
          printf '%s\n' 'Staged vyral-client@0.3.4. Review the staged tarball in npm, then approve its stage ID with npm 2FA. This workflow never approves or directly publishes it.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build authorized package artifacts
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - name: Check out the authorized release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and verify only the authorized distributions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.3.0
          python3 scripts/verify-publication-cohort.py
          scripts/verify-dotnet-lockfiles.sh
          mkdir -p artifacts/publish/nuget artifacts/publish/pypi
          for project in \
            src/Vyral.Abstractions/Vyral.Abstractions.csproj \
            src/Vyral.Local/Vyral.Local.csproj; do
            dotnet pack "$project" --configuration Release --no-restore \
              --output artifacts/publish/nuget
          done
          python -m build --outdir artifacts/publish/pypi runtimes/python
          for package in \
            Vyral.Abstractions.0.3.4 \
            Vyral.Local.0.3.4; do
            test -s "artifacts/publish/nuget/${package}.nupkg"
            test -s "artifacts/publish/nuget/${package}.snupkg"
          done
          test -s artifacts/publish/pypi/vyral-0.1.4-py3-none-any.whl
          test -s artifacts/publish/pypi/vyral-0.1.4.tar.gz

      - name: Retain immutable publication distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-release-v0.3.4
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: Publish authorized NuGet packages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: publish-nuget
      url: https://www.nuget.org/profiles/Univeracity
    permissions:
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download the authorized distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-release-v0.3.4
          path: dist

      - name: Exchange the GitHub OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish only the authorized NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in \
            Vyral.Abstractions.0.3.4 \
            Vyral.Local.0.3.4; do
            dotnet nuget push "dist/nuget/${package}.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate \
              --source https://api.nuget.org/v3/index.json
            dotnet nuget push "dist/nuget/${package}.snupkg" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate \
              --source https://api.nuget.org/v3/index.json
          done

  publish-pypi:
    name: Publish authorized Python runtime
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: publish-pypi
      url: https://pypi.org/p/vyral
    permissions:
      id-token: write
    steps:
      - name: Download the authorized distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-release-v0.3.4
          path: dist

      - name: Publish the Python runtime with its PyPI attestation
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi
          skip-existing: true

  verify:
    name: Verify public package availability
    needs:
      - publish-nuget
      - publish-pypi
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Wait for exact registry versions
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            nuget_abstractions="$(curl --fail --silent --show-error https://api.nuget.org/v3-flatcontainer/vyral.abstractions/index.json | jq -r '.versions[-1]')" || true
            nuget_local="$(curl --fail --silent --show-error https://api.nuget.org/v3-flatcontainer/vyral.local/index.json | jq -r '.versions[-1]')" || true
            pypi="$(curl --fail --silent --show-error https://pypi.org/pypi/vyral/json | jq -r '.info.version')" || true
            if [[ "$nuget_abstractions" == "0.3.4" && "$nuget_local" == "0.3.4" && "$pypi" == "0.1.4" ]]; then
              printf 'NuGet and PyPI expose every authorized package version.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "The authorized package versions were not all visible before the verification deadline." >&2
          exit 1
