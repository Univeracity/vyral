name: Publish worker-capable server container

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed server container tag for the reviewed worker-capable release
        required: true
        type: choice
        options:
          - server-v0.3.2
      confirm:
        description: I have reviewed the release evidence and worker capability notes
        required: true
        type: boolean

permissions: {}

concurrency:
  group: publish-server-container-v0.3.2
  cancel-in-progress: false

jobs:
  validate:
    name: Validate worker container release authority
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the signed current server tag and canonical evidence
        id: authority
        env:
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "true"
          test "$RELEASE_TAG" = "server-v0.3.2"
          git fetch --force --tags origin
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          source_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_sha" = "$(git rev-parse origin/main)"
          tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            | jq -e '.verification.verified == true' >/dev/null
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release-integrity.yml/runs?head_sha=$source_sha&event=push&status=success&per_page=20" \
            | jq -e '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length > 0' >/dev/null
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish and verify worker-capable server container
    needs: validate
    runs-on: ubuntu-22.04
    environment:
      name: publish-container
      url: https://github.com/Univeracity/vyral/pkgs/container/vyral-server
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the authorized release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up an attestation-capable BuildKit builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, attest, and publish the authorized server image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VYRAL_IMAGE_VERSION=0.3.2
            VYRAL_IMAGE_REVISION=${{ needs.validate.outputs.source_sha }}
          tags: ghcr.io/univeracity/vyral-server:0.3.2
          labels: |
            org.opencontainers.image.source=https://github.com/Univeracity/vyral
            org.opencontainers.image.version=0.3.2
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}

      - name: Qualify the exact published worker image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/univeracity/vyral-server@${IMAGE_DIGEST}"
          mkdir -p artifacts/publish
          docker pull "$image"
          scripts/verify-hosted-worker-container.sh \
            "$image" \
            artifacts/publish/hosted-worker-container.json
          printf '%s\n' "$IMAGE_DIGEST" > artifacts/publish/image-digest.txt
          printf 'Published immutable digest: `%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the exact published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vyral-trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --mount "type=bind,source=$RUNNER_TEMP/vyral-trivy-cache,target=/root/.cache/trivy" \
            --mount "type=bind,source=$PWD/artifacts/publish,target=/evidence" \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /evidence/vyral-server-trivy.json \
            "ghcr.io/univeracity/vyral-server@${IMAGE_DIGEST}"

      - name: Retain published-image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-container-server-v0.3.2
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 30
