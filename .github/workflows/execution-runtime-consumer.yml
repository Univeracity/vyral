name: Execution Runtime Consumer

on:
  pull_request:
    paths:
      - ".github/workflows/execution-runtime-consumer.yml"
      - "src/Vyral.Execution/**"
      - "src/Vyral.Execution.Aws/**"
      - "src/Vyral.Execution.Local/**"
      - "src/Vyral.Execution.AzureDurable/**"
      - "src/Vyral.Execution.AzureDurable.Functions/**"
      - "src/Vyral.Execution.Temporal/**"
      - "src/Vyral.Execution.Temporal.Hosting/**"
      - "src/Vyral.Execution.Temporal.Postgres/**"
      - "src/Vyral.Azure/**"
      - "src/Vyral.Primitives/**"
      - "src/Vyral.Execution.WorkerClient/**"
      - "clients/go/**"
      - "workers/execution-smoke-go/**"
      - "deploy/preflight-google-execution.sh"
      - "deploy/test-preflight-google-execution.sh"
      - "tests/Vyral.Tests.Conformance/**"
      - "tests/Vyral.Tests.Local/**"
      - "tests/Vyral.Tests.Azure/**"
      - "tests/Vyral.Tests.Temporal/**"
      - "samples/Vyral.Execution.LocalSample/**"
      - "samples/Vyral.Execution.AzureDurableLocalHost/**"
      - "samples/Vyral.Execution.AzureDurableFunctionsSmoke/**"
      - "scripts/validate-execution-runtime-consumer.sh"
      - "scripts/validate-execution-runtime-package-consumer.sh"
      - "scripts/validate-azure-durable-functions-live.sh"
      - "Directory.Build.props"
      - "Vyral.sln"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/execution-runtime-consumer.yml"
      - "src/Vyral.Execution/**"
      - "src/Vyral.Execution.Aws/**"
      - "src/Vyral.Execution.Local/**"
      - "src/Vyral.Execution.AzureDurable/**"
      - "src/Vyral.Execution.AzureDurable.Functions/**"
      - "src/Vyral.Execution.Temporal/**"
      - "src/Vyral.Execution.Temporal.Hosting/**"
      - "src/Vyral.Execution.Temporal.Postgres/**"
      - "src/Vyral.Azure/**"
      - "src/Vyral.Primitives/**"
      - "src/Vyral.Execution.WorkerClient/**"
      - "clients/go/**"
      - "workers/execution-smoke-go/**"
      - "deploy/preflight-google-execution.sh"
      - "deploy/test-preflight-google-execution.sh"
      - "tests/Vyral.Tests.Conformance/**"
      - "tests/Vyral.Tests.Local/**"
      - "tests/Vyral.Tests.Azure/**"
      - "tests/Vyral.Tests.Temporal/**"
      - "samples/Vyral.Execution.LocalSample/**"
      - "samples/Vyral.Execution.AzureDurableLocalHost/**"
      - "samples/Vyral.Execution.AzureDurableFunctionsSmoke/**"
      - "scripts/validate-execution-runtime-consumer.sh"
      - "scripts/validate-execution-runtime-package-consumer.sh"
      - "scripts/validate-azure-durable-functions-live.sh"
      - "Directory.Build.props"
      - "Vyral.sln"
  workflow_dispatch:

jobs:
  validate:
    name: Validate consumer path
    # Keep automatic runs fail-closed while CI failures are being resolved.
    # Manual dispatch remains available for controlled diagnostics.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.VYRAL_ENABLE_AUTOMATED_WORKFLOWS == 'true' }}
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Restore
        run: dotnet restore Vyral.sln

      - name: Validate local consumer contract
        run: scripts/validate-execution-runtime-consumer.sh

      - name: Validate package consumer
        run: scripts/validate-execution-runtime-package-consumer.sh

      - name: Validate Go external worker and deployment preflight
        run: |
          (cd clients/go && go test ./...)
          (cd workers/execution-smoke-go && go test ./...)
          deploy/test-preflight-google-execution.sh

      - name: Pack released execution packages
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/Vyral.Primitives/Vyral.Primitives.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution/Vyral.Execution.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.Aws/Vyral.Execution.Aws.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.Local/Vyral.Execution.Local.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.AzureDurable/Vyral.Execution.AzureDurable.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.AzureDurable.Functions/Vyral.Execution.AzureDurable.Functions.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.Temporal/Vyral.Execution.Temporal.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.Temporal.Hosting/Vyral.Execution.Temporal.Hosting.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.Temporal.Postgres/Vyral.Execution.Temporal.Postgres.csproj --no-restore -o artifacts/packages
          dotnet pack src/Vyral.Execution.WorkerClient/Vyral.Execution.WorkerClient.csproj --no-restore -o artifacts/packages

      - name: Upload execution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-runtime-packages
          path: artifacts/packages/*.nupkg
